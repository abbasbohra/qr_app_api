[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Root → Admin panel
[[redirects]]
  from = "/"
  to = "/admin"
  status = 302

# Admin panel
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# QR viewer — existing QR codes
[[redirects]]
  from = "/u/:id"
  to = "/.netlify/functions/qr-view?id=:id"
  status = 200
  force = true

# QR viewer — alternative route
[[redirects]]
  from = "/qr/:id"
  to = "/.netlify/functions/qr-view?id=:id"
  status = 200
  force = true

# API → Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200